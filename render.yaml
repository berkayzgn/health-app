services:
  - type: web
    name: health-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: health-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""

databases:
  - name: health-ai-db
    plan: free
    databaseName: healthai
    user: healthai
